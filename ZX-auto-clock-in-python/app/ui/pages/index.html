<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>ZX Admin 控制台</title>
    <link rel="stylesheet" href="/assets/styles.css?v=9.1">
</head>
<body>
    <svg class="svg-sprite" aria-hidden="true">
        <symbol id="icon-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="4" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/></symbol>
        <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
        <symbol id="icon-records" viewBox="0 0 24 24"><path d="M9 5h6M9 3h6v4H9z"/><path d="M7 5H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="m8 14 2 2 5-5"/></symbol>
        <symbol id="icon-sources" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63h.02A1.7 1.7 0 0 0 10 3.07V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9v.02A1.7 1.7 0 0 0 20.93 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.07 14H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63h.02A1.7 1.7 0 0 0 10 3.07V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.65a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9v.02A1.7 1.7 0 0 0 20.93 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
        <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></symbol>
        <symbol id="icon-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="icon-alert" viewBox="0 0 24 24"><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 15v5H4v-5"/></symbol>
        <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M20 20H4"/></symbol>
    </svg>

    <div class="app-shell">
        <aside class="sidebar" aria-label="主导航">
            <div class="brand">
                <span class="brand-mark">ZX</span>
                <span><strong>Admin</strong><small>Check-in Console</small></span>
            </div>
            <nav class="primary-nav">
                <a href="#/overview" data-route="overview"><svg><use href="#icon-overview"/></svg><span>总览</span></a>
                <a href="#/users" data-route="users"><svg><use href="#icon-users"/></svg><span>用户</span></a>
                <a href="#/records" data-route="records"><svg><use href="#icon-records"/></svg><span>打卡记录</span></a>
                <a href="#/sources" data-route="sources"><svg><use href="#icon-sources"/></svg><span>内容源</span></a>
                <a href="#/settings" data-route="settings"><svg><use href="#icon-settings"/></svg><span>系统设置</span></a>
            </nav>
            <div class="sidebar-foot">
                <p>单节点控制台</p>
                <button class="quiet-button" data-action="logout"><svg><use href="#icon-logout"/></svg>退出登录</button>
            </div>
        </aside>

        <main class="workspace">
            <header class="topbar">
                <div>
                    <p class="eyebrow" id="page-eyebrow">工作台</p>
                    <h1 id="page-title">总览</h1>
                    <p class="page-subtitle" id="page-subtitle">监控今日执行状态并处理失败任务</p>
                </div>
                <div class="topbar-actions">
                    <span class="live-indicator" id="live-indicator"><i></i><span>正在同步</span></span>
                    <button class="icon-button" data-action="refresh" aria-label="刷新当前页面" title="刷新"><svg><use href="#icon-refresh"/></svg></button>
                    <div id="page-primary-action"></div>
                </div>
            </header>
            <section class="page-content" id="page-content" aria-live="polite">
                <div class="loading-state"><span class="spinner"></span><p>正在加载控制台</p></div>
            </section>
        </main>
    </div>

    <nav class="mobile-nav" aria-label="手机导航">
        <a href="#/overview" data-route="overview"><svg><use href="#icon-overview"/></svg><span>总览</span></a>
        <a href="#/users" data-route="users"><svg><use href="#icon-users"/></svg><span>用户</span></a>
        <a href="#/records" data-route="records"><svg><use href="#icon-records"/></svg><span>记录</span></a>
        <button data-action="toggle-mobile-more" aria-expanded="false"><svg><use href="#icon-more"/></svg><span>更多</span></button>
    </nav>
    <div class="mobile-more" id="mobile-more" hidden>
        <a href="#/sources"><svg><use href="#icon-sources"/></svg><span><strong>内容源</strong><small>文字与图片来源</small></span><svg><use href="#icon-chevron"/></svg></a>
        <a href="#/settings"><svg><use href="#icon-settings"/></svg><span><strong>系统设置</strong><small>计划、Worker 与数据</small></span><svg><use href="#icon-chevron"/></svg></a>
    </div>

    <div class="drawer-layer" id="drawer-layer" aria-hidden="true">
        <button class="drawer-backdrop" data-action="close-drawer" aria-label="关闭抽屉"></button>
        <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
            <header class="drawer-header">
                <div><p class="eyebrow" id="drawer-eyebrow">编辑</p><h2 id="drawer-title">详细信息</h2></div>
                <button class="icon-button" data-action="close-drawer" aria-label="关闭"><svg><use href="#icon-close"/></svg></button>
            </header>
            <div class="drawer-body" id="drawer-body"></div>
        </aside>
    </div>

    <dialog class="confirm-dialog" id="confirm-dialog">
        <form method="dialog">
            <span class="dialog-icon"><svg><use href="#icon-alert"/></svg></span>
            <h2 id="confirm-title">确认操作</h2>
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button class="button secondary" value="cancel">取消</button>
                <button class="button danger" value="confirm" id="confirm-submit">确认</button>
            </div>
        </form>
    </dialog>

    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
    <script type="module" src="/assets/js/dashboard.js?v=9.1"></script>
</body>
</html>
