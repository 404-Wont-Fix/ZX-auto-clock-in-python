<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ZK 打卡系统</title>
    <link rel="stylesheet" href="/assets/login.css?v=2.0">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">ZK</div>
            <div class="login-header">
                <h1>欢迎回来</h1>
                <p>请登录以访问管理面板</p>
            </div>
            <div class="error" id="errorMessage"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="loginBtn">登录</button>
            </form>
            <div class="login-footer">
                ZK 自动打卡系统 v1.0
            </div>
        </div>
    </div>
    <script src="/assets/login.js?v=2.0"></script>
</body>
</html>
