services:
  zk-admin:
    build: .
    container_name: zk-admin
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8032:8000"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    environment:
      APP_ENV: production
      DEBUG: "false"
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
